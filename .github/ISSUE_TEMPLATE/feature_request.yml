name: Feature Request
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
assignees:
  - MaxenceLgt
  - mlargeot
  - neo-jgrec
  - dlucasdoo
type: feature

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting this idea!

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What need or frustration does this feature address?
      placeholder: "The way to use the SDK is not intuitive for new users."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear description of the change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or considered, and why they were insufficient.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact for you
      options:
        - Nice to have
        - I would use it regularly
        - It blocks my workflow
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
