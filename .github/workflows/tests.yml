name: Unit tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go tests with coverage
        run: make test-coverage
      # Uploads Go coverage to our self-hosted Codecov instance.
      # Requires the `CODECOV_TOKEN` GitHub Actions secret on HavelCTF/ProxmoxSDK,
      # which must match the self-hosted instance's `global_upload_token`.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          url: https://codecov.havel-ctf.com
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          slug: HavelCTF/ProxmoxSDK
          fail_ci_if_error: false
          verbose: true
