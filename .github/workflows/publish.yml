name: Build and Publish

on:
  push:
    branches: [main]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkg/typescript/package-lock.json

      - name: Build WASM binary
        run: make build copy-glue

      - name: Install TS dependencies
        working-directory: pkg/typescript
        run: npm ci

      - name: Build TS package
        working-directory: pkg/typescript
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test -v ./...

  publish-gpr:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkg/typescript/package-lock.json
          registry-url: https://npm.pkg.github.com/
          scope: '@havelctf'

      - name: Build WASM binary
        run: make build copy-glue

      - name: Install TS dependencies
        working-directory: pkg/typescript
        run: npm ci

      - name: Build TS package
        working-directory: pkg/typescript
        run: npm run build

      - name: Set prerelease version for dev builds
        if: github.event_name == 'push'
        working-directory: pkg/typescript
        run: npm version "$(node -p "require('./package.json').version")-dev.$(echo ${{ github.sha }} | cut -c1-7)" --no-git-tag-version

      - name: Publish to GitHub Packages
        working-directory: pkg/typescript
        run: npm publish ${{ github.event_name == 'push' && '--tag dev' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
